<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <button
      id="theme-toggle"
      aria-label="Switch to light mode"
      aria-pressed="false"
    >
      🌙 Dark
    </button>

    <main id="main-content" tabindex="-1">
      <div class="calculator">
        <div class="display">
          <span id="display">0</span>
        </div>

        <!-- Mode bar: SCI toggle sits above all button rows -->
        <div class="calculator-mode-bar">
          <button
            id="sci-toggle"
            class="btn-mode"
            data-action="toggleSci"
            aria-expanded="false"
            aria-controls="sci-panel"
          >
            SCI
          </button>
        </div>

        <!-- Scientific functions panel — hidden until SCI is toggled on -->
        <section
          id="sci-panel"
          class="buttons-scientific"
          aria-label="Scientific functions"
          hidden
        >
          <!-- Row 1: Primary trig + angle mode toggle -->
          <button class="btn btn-sci" data-scientific="sin" aria-label="Sine">
            sin
          </button>
          <button class="btn btn-sci" data-scientific="cos" aria-label="Cosine">
            cos
          </button>
          <button
            class="btn btn-sci"
            data-scientific="tan"
            aria-label="Tangent"
          >
            tan
          </button>
          <button
            id="angle-toggle"
            class="btn btn-sci btn-angle-active"
            data-action="toggleAngle"
            aria-label="Angle mode: Degrees — click to switch to Radians"
          >
            DEG
          </button>

          <!-- Row 2: Inverse trig + square -->
          <button
            class="btn btn-sci"
            data-scientific="asin"
            aria-label="Inverse sine"
          >
            sin⁻¹
          </button>
          <button
            class="btn btn-sci"
            data-scientific="acos"
            aria-label="Inverse cosine"
          >
            cos⁻¹
          </button>
          <button
            class="btn btn-sci"
            data-scientific="atan"
            aria-label="Inverse tangent"
          >
            tan⁻¹
          </button>
          <button
            class="btn btn-sci"
            data-scientific="square"
            aria-label="Square"
          >
            x²
          </button>

          <!-- Row 3: Roots + power + reciprocal -->
          <button
            class="btn btn-sci"
            data-scientific="sqrt"
            aria-label="Square root"
          >
            √x
          </button>
          <button
            class="btn btn-sci"
            data-scientific="cbrt"
            aria-label="Cube root"
          >
            ∛x
          </button>
          <button
            class="btn btn-sci btn-operator"
            data-operator="pow"
            aria-label="Raise to power (enter base, press xʸ, enter exponent, press equals)"
          >
            xʸ
          </button>
          <button
            class="btn btn-sci"
            data-scientific="reciprocal"
            aria-label="Reciprocal (1 divided by x)"
          >
            1/x
          </button>

          <!-- Row 4: Logarithms + constants -->
          <button
            class="btn btn-sci"
            data-scientific="log"
            aria-label="Logarithm base 10"
          >
            log
          </button>
          <button
            class="btn btn-sci"
            data-scientific="ln"
            aria-label="Natural logarithm"
          >
            ln
          </button>
          <button
            class="btn btn-sci"
            data-constant="pi"
            aria-label="Pi constant (3.14159…)"
          >
            π
          </button>
          <button
            class="btn btn-sci"
            data-constant="e"
            aria-label="Euler's number (2.71828…)"
          >
            e
          </button>

          <!-- Row 5: Misc -->
          <button
            class="btn btn-sci"
            data-scientific="factorial"
            aria-label="Factorial"
          >
            n!
          </button>
          <button
            class="btn btn-sci"
            data-scientific="exp"
            aria-label="e to the power x"
          >
            eˣ
          </button>
          <button
            class="btn btn-sci"
            data-scientific="pow10"
            aria-label="10 to the power x"
          >
            10ˣ
          </button>
          <button
            class="btn btn-sci"
            data-scientific="abs"
            aria-label="Absolute value"
          >
            |x|
          </button>
        </section>

        <div class="buttons">
          <button class="btn" data-action="clear">C</button>
          <button class="btn" data-action="negate">±</button>
          <button class="btn" data-action="percent">%</button>
          <button class="btn btn-operator" data-operator="/">÷</button>

          <button class="btn" data-number="7">7</button>
          <button class="btn" data-number="8">8</button>
          <button class="btn" data-number="9">9</button>
          <button class="btn btn-operator" data-operator="*">×</button>

          <button class="btn" data-number="4">4</button>
          <button class="btn" data-number="5">5</button>
          <button class="btn" data-number="6">6</button>
          <button class="btn btn-operator" data-operator="-">−</button>

          <button class="btn" data-number="1">1</button>
          <button class="btn" data-number="2">2</button>
          <button class="btn" data-number="3">3</button>
          <button class="btn btn-operator" data-operator="+">+</button>

          <button class="btn btn-zero" data-number="0">0</button>
          <button class="btn" data-number=".">.</button>
          <button class="btn btn-equals" data-action="equals">=</button>
        </div>
      </div>
    </main>

    <script src="js/scientific.js"></script>
    <script src="js/calculator.js"></script>
    <script src="js/ui.js"></script>
  </body>
</html>
